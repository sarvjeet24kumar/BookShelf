[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
addopts = --reuse-db --no-migrations --cov=. --cov-report=term-missing --cov-report=html
filterwarnings =
    ignore::DeprecationWarning:accounts.views.logout_view
norecursedirs = .* venv .venv tests/common
