name: CI/CD Pipeline
# Trigger point

on:
  push:
    branches: [ feat/test-cicd ]
  pull_request:
    branches: [ feat/test-cicd ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Create test .env
      run: |
        cat <<EOF > .env
        DOCKER_POSTGRES_USER=postgres
        DOCKER_POSTGRES_PASSWORD=postgres
        DOCKER_POSTGRES_DB=BookShelf
        DOCKER_DB_PORT=5433
        DOCKER_REDIS_PORT=6379
        DOCKER_API_PORT=8000
        DOCKER_DATABASE_URL=postgres://postgres:postgres@db:5432/BookShelf
        DOCKER_REDIS_URL=redis://redis:6379/1
        DOCKER_CELERY_BROKER_URL=redis://redis:6379/0
        DOCKER_CELERY_RESULT_BACKEND=redis://redis:6379/0
        SECRET_KEY=django-insecure-test-key
        OTP_EXPIRY_MINUTES=5
        USER_DATA_RETENTION_DAYS=30
        UNVERIFIED_USER_CLEANUP_HOURS=24
        SITE_URL=http://localhost:8000
        EMAIL_HOST_USER=test@example.com
        EMAIL_HOST_PASSWORD=test
        JWT_ACCESS_TOKEN_MINUTES=120
        JWT_REFRESH_TOKEN_DAYS=7
        EOF

    - name: Start Docker Compose
      run: |
        docker compose up -d --build
        sleep 10
        docker compose exec db pg_isready -h localhost -U postgres

    - name: Run Migrations and Tests
      run: |
        docker compose exec api sh -c "uv run python manage.py migrate --no-input && \
                                       uv run pytest"

    - name: Shutdown
      if: always()
      run: docker compose down

  build-scan-push:
    # needs: test  # Uncomment this line to re-enable tests before build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Create build .env
      run: |
        cat <<EOF > .env
        DOCKER_POSTGRES_USER=postgres
        DOCKER_POSTGRES_PASSWORD=postgres
        DOCKER_POSTGRES_DB=BookShelf
        DOCKER_DB_PORT=5433
        DOCKER_REDIS_PORT=6379
        DOCKER_API_PORT=8000
        DOCKER_DATABASE_URL=postgres://postgres:postgres@db:5432/BookShelf
        DOCKER_REDIS_URL=redis://redis:6379/1
        DOCKER_CELERY_BROKER_URL=redis://redis:6379/0
        DOCKER_CELERY_RESULT_BACKEND=redis://redis:6379/0
        SECRET_KEY=django-insecure-test-key
        OTP_EXPIRY_MINUTES=5
        USER_DATA_RETENTION_DAYS=30
        UNVERIFIED_USER_CLEANUP_HOURS=24
        SITE_URL=http://localhost:8000
        EMAIL_HOST_USER=test@example.com
        EMAIL_HOST_PASSWORD=test
        JWT_ACCESS_TOKEN_MINUTES=120
        JWT_REFRESH_TOKEN_DAYS=7
        EOF

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image via Docker Compose
      run: |
        DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/bookshelf:latest docker compose build api
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/bookshelf:latest ${{ secrets.DOCKERHUB_USERNAME }}/bookshelf:${{ github.sha }}

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/bookshelf:${{ github.sha }}
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL'

    - name: Push to Docker Hub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/bookshelf:${{ github.sha }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/bookshelf:latest


  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/django-app
            git fetch origin feat/test-cicd
            git reset --hard origin/feat/test-cicd
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/bookshelf:latest
            DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/bookshelf:latest docker compose up -d
            DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/bookshelf:latest docker compose exec -T api uv run python manage.py migrate --no-input
            DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/bookshelf:latest docker compose exec -T api uv run python manage.py collectstatic --no-input
