<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - BookShelf</title>
    <style>
        :root {
            --primary: #3498db;
            --primary-hover: #2980b9;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #2f3640;
            --text-light: #7f8c8d;
            --error: #e74c3c;
            --success: #2ecc71;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: var(--text);
        }

        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: block;
            text-decoration: none;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .message {
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            padding: 0.75rem;
            border-radius: 8px;
            display: none;
        }

        .message.error {
            background-color: #fdf0ef;
            color: var(--error);
            display: block;
        }

        .message.success {
            background-color: #eafaf1;
            color: var(--success);
            display: block;
        }

        #success-container {
            display: none;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card" id="form-container">
        {% if error %}
        <div class="header">
            <a href="#" class="logo">BookShelf</a>
            <h1 style="color: var(--error);">Link Invalid</h1>
        </div>
        <div class="message error" style="display: block; margin-top: 0;">
            {{ error }}
        </div>
        <p style="text-align: center; margin-top: 1.5rem;">
            Please <a href="/api/v1/auth/forgot-password/" style="color: var(--primary);">request a new reset link</a>.
        </p>
        {% else %}
        <div class="header">
            <a href="#" class="logo">BookShelf</a>
            <h1>Set New Password</h1>
        </div>
        <form id="reset-form">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" id="submit-btn">Reset Password</button>
            <div id="error-message" class="message error" style="display: none;"></div>
        </form>
        {% endif %}
    </div>

    <div class="card" id="success-container">
        <div class="header">
            <div style="font-size: 48px; color: var(--success); margin-bottom: 1rem;">✓</div>
            <h1>Password Updated</h1>
        </div>
        <p>Your password has been successfully reset. You can now log in with your new password.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const form = document.getElementById('reset-form');
        const errorDiv = document.getElementById('error-message');
        const formContainer = document.getElementById('form-container');
        const successContainer = document.getElementById('success-container');

        if (!token) {
            errorDiv.textContent = 'Invalid or missing reset token.';
            errorDiv.style.display = 'block';
            document.getElementById('submit-btn').disabled = true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match.';
                errorDiv.style.display = 'block';
                return;
            }

            if (password.length < 8) {
                errorDiv.textContent = 'Password must be at least 8 characters long.';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(window.location.href, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ password, confirm_password: confirmPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    formContainer.style.display = 'none';
                    successContainer.style.display = 'block';
                } else {
                    errorDiv.textContent = data.detail || 'An error occurred. Please try again.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
            }
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>

</html>
