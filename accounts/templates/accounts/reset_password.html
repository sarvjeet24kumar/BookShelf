<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #fff;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 16px;
        }

        label {
            font-size: 14px;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .error {
            color: #d9534f;
        }

        .success {
            color: #28a745;
        }

        .message {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="box">
        {% if error %}
        <h1 class="error">Invalid Link</h1>
        <p class="message error">{{ error }}</p>
        <p class="message">
            <a href="/api/v1/auth/forgot-password/">Request a new reset link</a>
        </p>

        {% elif success %}
        <h1 class="success">Password Updated</h1>
        <p class="message success">
            Your password has been reset successfully.
        </p>

        {% else %}
        <h1>Set New Password</h1>

        <form method="POST">
            {% csrf_token %}

            <label>New Password</label>
            <input type="password" name="password" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" required>

            <button type="submit">Reset Password</button>
        </form>

        {% if form_error %}
        <p class="message error">{{ form_error }}</p>
        {% endif %}
        {% endif %}
    </div>

</body>

</html>
