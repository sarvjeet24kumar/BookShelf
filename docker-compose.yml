services:

  redis:
    image: redis:7-alpine
    container_name: bookshelf-redis
    ports:
      - "${DOCKER_REDIS_PORT}:6379"

  api:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-api
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - SERVICE=web
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-BookShelf-API}
      - TZ=Asia/Kolkata
    volumes:
      - static_files:/app/staticfiles
    expose:
      - "8000"

  nginx:
    image: nginx:latest
    container_name: bookshelf-nginx
    depends_on:
      - api
    environment:
      - TZ=Asia/Kolkata
      - DOMAIN_NAME=${DOMAIN_NAME:-bookshelf.isroot.in}
    ports:
      - "${DOCKER_API_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - static_files:/app/staticfiles:ro
      - /usr/share/zoneinfo/Asia/Kolkata:/etc/localtime:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    command: >
      /bin/sh -c "
      DOMAIN_NAME=$${DOMAIN_NAME:-bookshelf.isroot.in};
      envsubst '$$DOMAIN_NAME' < /etc/nginx/nginx.conf.template > /etc/nginx/conf.d/default.conf &&
      if [ ! -f /etc/letsencrypt/live/$${DOMAIN_NAME}/fullchain.pem ]; then
        echo 'Creating dummy certificates for '$${DOMAIN_NAME}'...';
        mkdir -p /etc/letsencrypt/live/$${DOMAIN_NAME};
        openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /etc/letsencrypt/live/$${DOMAIN_NAME}/privkey.pem -out /etc/letsencrypt/live/$${DOMAIN_NAME}/fullchain.pem -subj '/CN=localhost';
      fi;
      nginx -g 'daemon off;' &
      echo 'Waiting for real certificate to trigger reload...';
      (while [ ! -f /etc/letsencrypt/live/$${DOMAIN_NAME}/cert.pem ]; do sleep 10; done; echo 'Real cert detected, reloading Nginx...'; nginx -s reload) &
      while :; do
        sleep 6h & wait $${!};
        nginx -s reload;
      done"
    restart: unless-stopped

  worker:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-worker
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - SERVICE=celery_worker
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-BookShelf-Worker}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - TZ=Asia/Kolkata

  beat:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-beat
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - SERVICE=celery_beat
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-BookShelf-Beat}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - TZ=Asia/Kolkata

  locust:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-locust
    depends_on:
      - api
    command: ["uv", "run", "locust", "-f", "tests/performance/locustfile.py", "--host", "http://api:8000"]
    ports:
      - "8089:8089"
    environment:
      - TZ=Asia/Kolkata

  certbot:
    image: certbot/certbot
    container_name: bookshelf-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-bookshelf.isroot.in}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-jha.sarvjeet1@gmail.com}
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      DOMAIN_NAME=$${DOMAIN_NAME:-bookshelf.isroot.in};
      CERTBOT_EMAIL=$${CERTBOT_EMAIL:-jha.sarvjeet1@gmail.com};
      echo 'Waiting for Nginx to be ready (30s)...';
      sleep 30;
      if [ ! -f /etc/letsencrypt/live/$${DOMAIN_NAME}/cert.pem ]; then
        echo 'Clearing dummy certificates for '$${DOMAIN_NAME}' before requesting real ones...';
        rm -rf /etc/letsencrypt/live/$${DOMAIN_NAME};
        rm -rf /etc/letsencrypt/archive/$${DOMAIN_NAME};
        for i in 1 2 3; do
          echo 'Attempt '$${i}' to acquire certificate for '$${DOMAIN_NAME}'...';
          certbot certonly --webroot -w /var/www/certbot -d $${DOMAIN_NAME} --email $${CERTBOT_EMAIL} --agree-tos --no-eff-email --non-interactive && break;
          echo 'Attempt '$${i}' failed, retrying in 30 seconds...';
          sleep 30;
        done;
      fi;
      while :; do
        echo 'Checking for certificate renewal...';
        certbot renew;
        sleep 12h & wait $${!};
      done"

volumes:
  static_files:
  certbot_etc:
  certbot_var:
  certbot_www:
