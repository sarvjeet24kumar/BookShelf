services:

  redis:
    image: redis:7-alpine
    container_name: bookshelf-redis
    ports:
      - "${DOCKER_REDIS_PORT}:6379"

  api:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-api
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - SERVICE=web
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - TZ=Asia/Kolkata
    volumes:
      - static_files:/app/staticfiles
    expose:
      - "8000"

  nginx:
    build:
      context: ./nginx
    container_name: bookshelf-nginx
    depends_on:
      - api
    environment:
      - TZ=Asia/Kolkata
    ports:
      - "${DOCKER_API_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    restart: unless-stopped

  worker:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-worker
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - SERVICE=celery_worker
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - TZ=Asia/Kolkata

  beat:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-beat
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - SERVICE=celery_beat
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - TZ=Asia/Kolkata

  locust:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-locust
    depends_on:
      - api
    command: ["uv", "run", "locust", "-f", "tests/performance/locustfile.py", "--host", "http://api:8000"]
    ports:
      - "8089:8089"
    environment:
      - TZ=Asia/Kolkata

volumes:
  static_files:
