services:
  db:
    image: postgres:15-alpine
    container_name: bookshelf-db
    environment:
      POSTGRES_USER: ${DOCKER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DOCKER_POSTGRES_DB}
    ports:
      - "${DOCKER_DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bookshelf-redis
    ports:
      - "${DOCKER_REDIS_PORT}:6379"

  api:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-api
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DEBUG=True
    volumes:
      - static_files:/app/staticfiles
    expose:
      - "8000"
    command: >
      sh -c "uv run python manage.py migrate --no-input &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  nginx:
    image: nginx:alpine
    container_name: bookshelf-nginx
    depends_on:
      - api
    ports:
      - "${DOCKER_API_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    restart: unless-stopped

  worker:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-worker
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    command: uv run celery -A config worker --loglevel=info

  beat:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-beat
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    command: uv run celery -A config beat --loglevel=info

volumes:
  postgres_data:
  static_files:
