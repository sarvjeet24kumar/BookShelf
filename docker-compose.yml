services:

  redis:
    image: redis:7-alpine
    container_name: bookshelf-redis
    ports:
      - "${DOCKER_REDIS_PORT}:6379"

  api:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-api
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    volumes:
      - static_files:/app/staticfiles
    expose:
      - "8000"
    command: >
      sh -c "uv run python manage.py migrate --no-input accounts 0006 &&
             uv run python manage.py migrate --no-input --fake accounts 0007 &&
             uv run python manage.py migrate --no-input &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  nginx:
    image: nginx:alpine
    container_name: bookshelf-nginx
    depends_on:
      - api
    ports:
      - "${DOCKER_API_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    restart: unless-stopped

  worker:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-worker
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    command: uv run celery -A config worker --loglevel=info

  beat:
    build: .
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-beat
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    command: uv run celery -A config beat --loglevel=info

volumes:
  static_files:
