services:

  redis:
    image: redis:7-alpine
    container_name: bookshelf-redis
    ports:
      - "${DOCKER_REDIS_PORT}:6379"

  api:
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-api
    command: web 
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-BookShelf-API}
      - TZ=Asia/Kolkata
    volumes:
      - static_files:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:latest
    container_name: bookshelf-nginx
    depends_on:
      - api
      - grafana
    environment:
      - TZ=Asia/Kolkata
      - DOMAIN_NAME=${DOMAIN_NAME:-bookshelf.isroot.in}
    ports:
      - "${DOCKER_API_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - static_files:/app/staticfiles:ro
      - /usr/share/zoneinfo/Asia/Kolkata:/etc/localtime:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    command: |
      /bin/sh -c "
        DOMAIN_NAME=$${DOMAIN_NAME:-bookshelf.isroot.in}
        envsubst '$$DOMAIN_NAME' < /etc/nginx/nginx.conf.template > /etc/nginx/conf.d/default.conf
        if [ ! -f /etc/letsencrypt/live/$${DOMAIN_NAME}/fullchain.pem ]; then
          echo \"Creating dummy certificates for $$DOMAIN_NAME...\"
          mkdir -p /etc/letsencrypt/live/$$DOMAIN_NAME
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /etc/letsencrypt/live/$$DOMAIN_NAME/privkey.pem -out /etc/letsencrypt/live/$$DOMAIN_NAME/fullchain.pem -subj '/CN=localhost'
        fi
        nginx -g 'daemon off;' &
        echo \"Waiting for real certificate...\"
        while [ ! -f /etc/letsencrypt/live/$$DOMAIN_NAME/cert.pem ]; do sleep 10; done
        echo \"Real cert detected, reloading Nginx...\"
        nginx -s reload
        while :; do
          sleep 6h
          nginx -s reload
        done"
    restart: unless-stopped

  worker:
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-worker
    command: celery_worker
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-BookShelf-Worker}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - TZ=Asia/Kolkata

  beat:
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-beat
    command: celery_beat
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-BookShelf-Beat}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - CELERY_BROKER_URL=${DOCKER_CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${DOCKER_CELERY_RESULT_BACKEND}
      - TZ=Asia/Kolkata

  locust:
    image: ${DOCKER_IMAGE:-bookshelf-api}
    container_name: bookshelf-locust
    depends_on:
      - api
    command: ["uv", "run", "locust", "-f", "tests/performance/locustfile.py", "--host", "http://api:8000"]
    ports:
      - "8089:8089"
    environment:
      - TZ=Asia/Kolkata

  certbot:
    image: certbot/certbot
    container_name: bookshelf-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-bookshelf.isroot.in}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-jha.sarvjeet1@gmail.com}
    entrypoint: |
      /bin/sh -c "
        DOMAIN_NAME=$${DOMAIN_NAME:-bookshelf.isroot.in}
        CERTBOT_EMAIL=$${CERTBOT_EMAIL:-jha.sarvjeet1@gmail.com}
        echo \"Waiting for Nginx to be ready (30s)...\"
        sleep 30
        if [ ! -f /etc/letsencrypt/live/$$DOMAIN_NAME/cert.pem ]; then
          echo \"Cleaning up any previous or broken certificates for $$DOMAIN_NAME...\"
          rm -rf /etc/letsencrypt/live/$$DOMAIN_NAME*
          rm -rf /etc/letsencrypt/archive/$$DOMAIN_NAME*
          rm -rf /etc/letsencrypt/renewal/$$DOMAIN_NAME*.conf
          for i in 1 2 3; do
            echo \"Attempt $$i to acquire certificate for $$DOMAIN_NAME...\"
            certbot certonly --webroot -w /var/www/certbot -d $$DOMAIN_NAME --email $$CERTBOT_EMAIL --agree-tos --no-eff-email --non-interactive && break
            echo \"Attempt $$i failed, retrying in 30 seconds...\"
            sleep 30
          done
        fi
        while :; do
          echo \"Checking for certificate renewal...\"
          certbot renew
          sleep 12h
        done"

  prometheus:
    image: prom/prometheus:latest
    container_name: bookshelf-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/console_templates'
      - '--web.enable-lifecycle'
    expose:
      - "9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: bookshelf-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN_NAME:-bookshelf.isroot.in}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    restart: unless-stopped

volumes:
  static_files:
  certbot_etc:
  certbot_var:
  certbot_www:
  prometheus_data:
  grafana_data:
