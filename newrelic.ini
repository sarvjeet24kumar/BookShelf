# newrelic.ini
# Core configuration for New Relic Python Agent
[newrelic]
# License Key (Late-binding via NEW_RELIC_LICENSE_KEY environment variable)
# license_key = 

# App Name (Late-binding via NEW_RELIC_APP_NAME environment variable)
app_name = BookShelf-Prod

# Enable/Disable agent
monitor_mode = true

# Log level
log_level = info
log_file = stdout

# Transaction tracer
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated

# Error collector
error_collector.enabled = true
error_collector.ignore_errors = django.exceptions.NotFound django.core.exceptions.PermissionDenied

# Application Logging (Real-time logs)
application_logging.enabled = true
application_logging.forwarding.enabled = true
