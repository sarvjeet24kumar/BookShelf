[project]
name = "bookshelf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.2",
    "django>=6.0",
    "django-environ>=0.12.0",
    "django-filter>=25.2",
    "django-silk>=5.4.3",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.29.0",
    "factory-boy>=3.3.3",
    "gunicorn>=25.1.0",
    "psycopg[binary]>=3.3.2",
    "pyinstrument>=5.1.2",
    "pytest-factoryboy>=2.8.1",
    "python-dotenv>=1.2.1",
    "razorpay>=2.0.0",
    "redis>=7.1.0",
    "uuid6>=2025.0.1",
    "newrelic>=9.0.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "factory-boy>=3.3.3",
    "faker>=40.8.0",
    "locust>=2.43.3",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.12.0",
    "pytest-mock>=3.15.1",
]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/manage.py",
    "*/config/*",
    "*/wsgi.py",
    "*/asgi.py",
    "*/apps.py",
    "*/admin.py",
    "*/common/*",
    "*/accounts/signals.py",
    "*/books/signals.py",
    "*__init__.py",
    "*/tests.py",
    "*/urls.py",
    "main.py",
    "tenants/middleware.py",
    "tenants/tasks.py",
]
